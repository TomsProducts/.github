<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Gateway arch icon (Janus = gateway god) -->
  <!-- Outer arch -->
  <path d="M 10,95 L 10,50 Q 10,20 45,20 Q 80,20 80,50 L 80,95" 
        fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
  <!-- Inner arch -->
  <path d="M 26,95 L 26,55 Q 26,36 45,36 Q 64,36 64,55 L 64,95"
        fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"/>
  <!-- Base line -->
  <line x1="6" y1="95" x2="84" y2="95" stroke="url(#g3)" stroke-width="4" stroke-linecap="round"/>
  <!-- Center dot (keystone) -->
  <circle cx="45" cy="28" r="4" fill="url(#g1)"/>

  <!-- Wordmark -->
  <text x="104" y="72"
        font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1"
        fill="url(#g1)">Janorix</text>

  <!-- Tagline -->
  <text x="106" y="94"
        font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="10" letter-spacing="3" fill="url(#g2)"
        opacity="0.9">THE GATEWAY LAYER FOR AI AGENTS</text>
</svg>
